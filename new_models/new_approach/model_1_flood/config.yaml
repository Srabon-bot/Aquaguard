project:
  name: "Water-Level Forecasting at Bahadurabad"
  station: "Bahadurabad"
  station_code: "SW46.9L"
  period: "2008-2022"

data:
  raw_wl_q_path: "Data/Q/Own_Rated_Q_2008-2022_Bahadurabad.csv"
  processed_dir: "data/processed"
  raw_dir: "data/raw"

thresholds:
  danger_level: 19.05
  extreme_level: 19.90
  rhwl: 20.63
  warning_level: 18.50

splits:
  dev_start_year: 2008
  dev_end_year: 2019
  test_start_year: 2020
  test_end_year: 2022
  gap_days: 7

horizons: [1, 3, 7, 14]
lags: [0, 1, 2, 3, 4, 5, 6, 7]

random_seed: 42

catchment_box:
  lon_min: 82.0
  lon_max: 98.0
  lat_min: 24.0
  lat_max: 32.0

output:
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  predictions_dir: "outputs/predictions"
  captions_path: "captions.md"
